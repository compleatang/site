[site]
title = "underWater Desert Blogging"
description = "An old man yells at his loopback"
base_url = "https://caseykuhlman.com"
language = "en"
author = ""

[languages]

[images]
widths = [
    480,
    800,
    1200,
]
quality = 80
lazy_loading = true
webp = true
avif_quality = 70

[build]
output_dir = "dist"
content_dir = "content"
template_dir = "templates"
static_dir = "static"
data_dir = "data"
public_dir = "public"
minify = true

[deploy]
target = "github-pages"
auto_commit = true

[[collections]]
name = "posts"
label = "Posts"
directory = "posts"
has_date = true
has_rss = true
listed = true
url_prefix = "/posts"
nested = false
default_template = "post.html"

[[collections]]
name = "pages"
label = "Pages"
directory = "static"
has_date = false
has_rss = false
listed = false
url_prefix = ""
nested = false
default_template = "page.html"

[[collections]]
name = "archive"
label = "Archive"
directory = "zarchive"
has_date = true
has_rss = true
listed = true
url_prefix = "/archive"
nested = false
default_template = "post.html"
